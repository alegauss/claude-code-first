# The gates of this repository, on every push and pull request.
#
# A gate that runs only on one machine is not a gate: freewilly removed its lint from CI
# (cd630d6) and restored it (714360e) after drift reached main unremarked. Later gates,
# such as citation resolution and traceability, are added here as jobs, not as new files.
# `roadkeep lint` is the one exception: it is roadkeep.yml, the workflow
# `roadkeep install` writes, so a later install finds it and adds no second copy.
name: check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Settings live in lychee.toml, so a local run checks exactly what this one does.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true

  markdown:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rules and ignores live in .markdownlint-cli2.jsonc.
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  skills:
    name: skill size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A skill's description is paid on every turn; the caps are in the script.
      - run: python3 scripts/check_skills.py

  citations:
    name: citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The scripts' own tests
        run: python3 -m unittest discover -s scripts
      - name: The findings index is current and every finding well formed
        run: python3 scripts/index_findings.py --check
      - name: Every term a rule uses is in the glossary
        run: python3 scripts/check_glossary.py
      - name: Every catalogue entry has the form and links a rule
        run: python3 scripts/check_catalogue.py
      # Every evidence pointer against the pinned corpus, which the resolver clones from
      # the remotes in evidence/corpus.md. Two projects cannot be reached from here and
      # are named rather than skipped in silence: Shio's repository is private, and
      # winwright's pinned commit has not been pushed. Drop a name once it is reachable.
      - name: Every pointer resolves
        run: >-
          python3 scripts/resolve_citations.py
          --allow-unreachable shio
          --allow-unreachable winwright
