[[rule]]
address = "AP-1"
chapter = "AP"
title = "A ceiling on what the surface costs"
keyword = "MUST"
level = "profile"
statement = "Each surface a product serves to agents, its tool schemas, skill descriptions and bodies, and command responses, MUST carry a token ceiling that a gate enforces, raised only with its reason written beside the number or in the commit that raises it."
checked = "by judgement"
detector = ""
findings = ["F406", "F4"]
harness = ["H3", "H9"]
status = "active"

